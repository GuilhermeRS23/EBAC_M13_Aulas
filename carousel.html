<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>M13 Aula 2 | Carousel</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
  </head>
  <body>
    <div class="container">
        <h1>Bootstrap - Carousel</h1>
      <div
        id="carousel-exemplo"
        class="carousel carousel-fade slide"
        data-bs-ride="carousel"
      >
        <div class="carousel-inner">
          <div data-bs-interval="3000" class="carousel-item active">
            <img
              class="d-block w-100"
              src="https://cdn.pixabay.com/photo/2022/05/08/10/13/animal-7181776_960_720.jpg"
            />
            <div class="carousel-caption">
              <h2>Foto de um gato</h2>
            </div>
          </div>
          <div data-bs-interval="3000" class="carousel-item">
            <img
              class="d-block w-100"
              src="https://cdn.pixabay.com/photo/2021/08/22/20/27/corner-ball-6566084_1280.jpg"
            />
            <div class="carousel-caption">
              <h2>Foto sobre Futebol</h2>
            </div>
          </div>
          <div data-bs-interval="3000" class="carousel-item">
            <img
              class="d-block w-100"
              src="https://cdn.pixabay.com/photo/2021/09/05/21/59/soccer-ball-6600446_1280.jpg"
            />
            <div class="carousel-caption">
              <h2>Foto da Brazuca</h2>
            </div>
          </div>
        </div>
        <button
          data-bs-target="#carousel-exemplo"
          data-bs-slide="prev"
          class="carousel-control-prev"
          type="button"
        >
          <span class="carousel-control-prev-icon"></span>
        </button>
        <button
          data-bs-target="#carousel-exemplo"
          data-bs-slide="next"
          class="carousel-control-next"
        >
          <span class="carousel-control-next-icon"></span>
        </button>
        <div class="carousel-indicators">
          <button
            type="button"
            data-bs-target="#carousel-exemplo"
            class="active"
            data-bs-slide-to="0"
          ></button>
          <button
            type="button"
            data-bs-target="#carousel-exemplo"
            data-bs-slide-to="1"
          ></button>
          <button
            type="button"
            data-bs-target="#carousel-exemplo"
            data-bs-slide-to="2"
          ></button>
        </div>
      </div>
    </div>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
