<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>M13 | Tarefa</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
      integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <link rel="stylesheet" href="main.css" />
  </head>
  <body>
    <header id="cabecalho">
      <div class="navbar navbar-expand-lg">
        <div class="container fs-5 fw-bold">
          <a class="navbar-brand" href="#">
            <img width="50" src="imgs/logo.png" alt="Logo Site" />
            ANIMEFLIX
          </a>

          <button
            type="button"
            class="navbar-toggler"
            data-bs-toggle="collapse"
            data-bs-target="#menu"
          >
            <span class="navbar-toggler-icon"></span>
          </button>
          <nav class="collapse navbar-collapse justify-content-end" id="menu">
            <ul class="nav navbar-nav">
              <li class="nav-item">
                <a class="nav-link active" href="#destaques">Destaques</a>
              </li>
              <li class="nav-item">
                <a class="nav-link" href="#novidades">Novidades</a>
              </li>
              <li class="nav-item">
                <a class="nav-link" href="#promocoes">Promoções</a>
              </li>
              <li class="nav-item">
                <a class="nav-link" href="#contato">Contato</a>
              </li>
            </ul>
          </nav>
        </div>
      </div>
    </header>

    <div data-bs-spy="scroll" data-bs-target="#cabecalho">
      <section class="container-fluid p-0" id="destaques">
        <div id="carousel" class="carousel slide" data-bs-ride="carousel">
          <div class="carousel-inner">
            <div data-bs-interval="3000" class="carousel-item active">
              <img
                class="d-block w-100"
                src="https://placehold.co/1280x720"
                alt="Solo Leveling"
              />
              <div
                class="carousel-caption text-start mb-md-3 pb-md-3 mb-xl-5 pb-xl-5"
              >
                <h2>Solo Leveling</h2>
                <p>
                  Some representative placeholder content for the first slide.
                </p>
              </div>
            </div>
            <div data-bs-interval="3000" class="carousel-item">
              <img
                class="d-block w-100"
                src="https://placehold.co/1280x720"
                alt="BlueLock"
              />
              <div
                class="carousel-caption text-start mb-md-3 pb-md-3 mb-xl-5 pb-xl-5"
              >
                <h2>BlueLock</h2>
                <p>
                  Some representative placeholder content for the first slide.
                </p>
              </div>
            </div>

            <button
              data-bs-target="#carousel"
              data-bs-slide="prev"
              class="carousel-control-prev"
              type="button"
            >
              <span class="carousel-control-prev-icon"></span>
            </button>
            <button
              data-bs-target="#carousel"
              data-bs-slide="next"
              class="carousel-control-next"
              type="button"
            >
              <span class="carousel-control-next-icon"></span>
            </button>
            <div class="carousel-indicators">
              <button
                type="button"
                data-bs-target="#carousel"
                class="active"
                data-bs-slide-to="0"
              ></button>
              <button
                type="button"
                data-bs-target="#carousel"
                data-bs-slide-to="1"
              ></button>
              <button
                type="button"
                data-bs-target="#carousel"
                data-bs-slide-to="2"
              ></button>
              <button
                type="button"
                data-bs-target="#carousel"
                data-bs-slide-to="3"
              ></button>
              <button
                type="button"
                data-bs-target="#carousel"
                data-bs-slide-to="4"
              ></button>
              <button
                type="button"
                data-bs-target="#carousel"
                data-bs-slide-to="5"
              ></button>
            </div>
          </div>
        </div>
      </section>

      <section class="container p-5 mt-2" id="novidades">
        <h2 class="text-white">Novidades</h2>
        <div class="row g-5 mt-4">
          <div class="col-lg-4 col-sm-12 col-md-6">
            <div class="card h-100">
              <img
                src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTnS2MFEl4PrR6xloS_Fp7GlMzTrTJoxjN0Sg&s"
              />
              <div class="card-body d-flex justify-content-between">
                <h4 class="card-title">BlueLock</h4>
                <a href="#" class="btn btn-play" title="Assistir"
                  ><i class="fa-solid fa-play"></i
                ></a>
              </div>
            </div>
          </div>

          <div class="col-lg-4 col-sm-12 col-md-6">
            <div class="card h-100">
              <img
                src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTnS2MFEl4PrR6xloS_Fp7GlMzTrTJoxjN0Sg&s"
              />
              <div class="card-body d-flex justify-content-between">
                <h4 class="card-title">BlueLock</h4>
                <a href="#" class="btn btn-play" title="Assistir"
                  ><i class="fa-solid fa-play"></i
                ></a>
              </div>
            </div>
          </div>

          <div class="col-lg-4 col-sm-12 col-md-6">
            <div class="card h-100">
              <img
                src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTnS2MFEl4PrR6xloS_Fp7GlMzTrTJoxjN0Sg&s"
              />
              <div class="card-body d-flex justify-content-between">
                <h4 class="card-title">BlueLock</h4>
                <a href="#" class="btn btn-play" title="Assistir"
                  ><i class="fa-solid fa-play"></i
                ></a>
              </div>
            </div>
          </div>

          <div class="col-lg-4 col-sm-12 col-md-6">
            <div class="card h-100">
              <img
                src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTnS2MFEl4PrR6xloS_Fp7GlMzTrTJoxjN0Sg&s"
              />
              <div class="card-body d-flex justify-content-between">
                <h4 class="card-title">BlueLock</h4>
                <a href="#" class="btn btn-play" title="Assistir"
                  ><i class="fa-solid fa-play"></i
                ></a>
              </div>
            </div>
          </div>
        </div>
      </section>
    </div>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
